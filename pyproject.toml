[tool.poetry]
name = "marutools"
version = "1.0.2"
description = "Marutools is collection of tools(editor, player, convertor...)."
authors = ["Maruo.S <raspi-maru2004@outlook.jp>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
chardet = "^5.0.0"
Babel = "^2.10.3"

[tool.poetry.group.bluray.dependencies]
tkmedia = "^0.1.3"
bdmvkit = "^0.7.0"
udfkit = "^0.2.0"

[tool.poetry.group.tkgui.dependencies]
tkfilebrowser = "^2.3.2"
ttkthemes = "^3.2.2"
Pillow = "^10.3.0"
gttk = "^0.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
